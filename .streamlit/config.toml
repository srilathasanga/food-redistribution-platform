# Look and feel: royal blue + coral, warm and hopeful, easy to read on
# phones. Colours are defined ONCE here; app/ui.py only picks which named
# colour each status uses, plus a small style sheet for what the theme
# cannot do (banner, card shadows, sidebar highlight, coral accents).
#
# Contrast (WCAG AA) was checked for every text/background pair:
#   white on royal blue #364FC7 6.8:1, links on the page 6.5:1,
#   body text 13.8:1, every badge 5.7:1 or better.
# Coral #FF6B6B is too light for white text (2.8:1), so it is NEVER a
# background behind white text. As an icon colour (needs 3:1) it is
# deepened to #F03E3E on light backgrounds and card tints (3.4:1 or
# better) and lightened to #FFA8A8 on the blue banner (3.1:1).
#
# Status colours (badge = light tint + dark text of the same hue):
#   green   = available / verified / active
#   yellow  = reserved / waiting (amber)
#   primary = volunteer assigned (royal blue)
#   blue    = picked up. NOTE: the "blue" slot is set to TEAL here,
#             because royal blue is already the primary colour.
#   violet  = delivered (purple)
#   red     = urgent / expired / not approved (a true red, not coral)
#   gray    = pending / switched off
#   orange  = coral, for icons only (never for words)

[theme]
base = "light"

primaryColor = "#364FC7"          # royal blue: buttons, links, focus
backgroundColor = "#F8F9FF"       # page
secondaryBackgroundColor = "#EDF2FF"
textColor = "#1F2A37"             # dark slate
borderColor = "#DCE2F5"
linkColor = "#364FC7"
linkUnderline = false

# Fonts and sizes (approved earlier, unchanged).
font = "Nunito Sans:https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700&display=swap, sans-serif"
headingFont = "Poppins:https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&display=swap, sans-serif"
baseFontSize = 18
headingFontSizes = ["34px", "24px", "20px", "18px", "18px", "18px"]
headingFontWeights = [700, 700, 600, 600, 600, 600]
baseRadius = "14px"
buttonRadius = "14px"

# Status colours.
greenColor = "#2B8A3E"
greenBackgroundColor = "#D3F9D8"
greenTextColor = "#1E6B2F"

yellowColor = "#F59F00"
yellowBackgroundColor = "#FFEC99"
yellowTextColor = "#7A4A00"

blueColor = "#0CA678"             # teal (see note above)
blueBackgroundColor = "#C3FAE8"
blueTextColor = "#0B5D50"

violetColor = "#7048E8"
violetBackgroundColor = "#E5DBFF"
violetTextColor = "#4A2BB0"

redColor = "#E03131"
redBackgroundColor = "#FFE3E3"
redTextColor = "#A51D1D"

grayColor = "#868E96"
grayBackgroundColor = "#E9ECEF"
grayTextColor = "#343A40"

orangeColor = "#F03E3E"           # coral, icons only
orangeBackgroundColor = "#FFF0F0"
orangeTextColor = "#F03E3E"

# Charts: royal blue first, then the status colours.
chartCategoricalColors = ["#364FC7", "#F03E3E", "#2B8A3E", "#0CA678", "#7048E8", "#F59F00"]

[theme.sidebar]
backgroundColor = "#EDF2FF"
secondaryBackgroundColor = "#DBE4FF"
textColor = "#1F2A37"
headingFontSizes = ["24px", "20px", "18px", "17px", "16px", "15px"]
